<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10131a;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: #191d27;
      padding: 30px;
      border-radius: 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #aeb4c0;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #383e4b;
      border-radius: 10px;
      background: #0f1218;
      color: white;
      outline: none;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #4f7cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #result {
      display: none;
      margin-top: 25px;
    }

    .quality {
      margin-top: 12px;
      background: #242936;
      padding: 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .quality button {
      width: auto;
      padding: 9px 15px;
      font-size: 14px;
    }

    .error {
      color: #ff7d7d;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Video Downloader</h1>

    <p>Paste a direct video file link</p>

    <input
      id="videoUrl"
      type="url"
      placeholder="https://example.com/video.mp4"
    >

    <button onclick="checkVideo()">Get Video</button>

    <div id="result">

      <div class="quality">
        <span>Video</span>
        <button onclick="openVideo()">Open</button>
      </div>

    </div>

    <div id="error" class="error"></div>

  </div>

  <script>
    let currentUrl = "";

    function checkVideo() {

      const input = document.getElementById("videoUrl");
      const result = document.getElementById("result");
      const error = document.getElementById("error");

      const url = input.value.trim();

      result.style.display = "none";
      error.textContent = "";

      if (!url) {
        error.textContent = "Please enter a video URL.";
        return;
      }

      try {
        const parsed = new URL(url);

        if (!["http:", "https:"].includes(parsed.protocol)) {
          throw new Error();
        }

        currentUrl = parsed.href;
        result.style.display = "block";

      } catch {
        error.textContent = "Please enter a valid video URL.";
      }
    }

    function openVideo() {
      if (!currentUrl) return;

      window.open(currentUrl, "_blank");
    }
  </script>

</body>
</html>
